plugins { id 'com.android.application' }

android {
    namespace 'com.khalid.translator'
    compileSdk 34

    defaultConfig {
        applicationId "com.khalid.translator"
        minSdk 24
        targetSdk 34
        versionCode 9
        versionName "3.1"
    }

    // Fixed signing key: every build is signed the same way, so new versions
    // install OVER the old one on the phone (keeping meetings and settings).
    signingConfigs {
        fixed {
            storeFile file('translator.keystore')
            storeType 'pkcs12'
            storePassword 'translator2026'
            keyAlias 'translator'
            keyPassword 'translator2026'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.fixed
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.fixed
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.webkit:webkit:1.9.0'
}
